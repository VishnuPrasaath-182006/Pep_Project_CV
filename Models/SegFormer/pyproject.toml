[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "segformer-floodplanet"
version = "0.1.0"
description = "Event-Generalizable Flood Inundation Semantic Segmentation Using SegFormer and Leave-One-Event-Out Cross-Validation"
authors = [
    { name = "AI Research Engineer" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0,<5.0.0",
    "tifffile>=2024.1.0",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

