# Fast Pipeline Verification Configuration (CPU-Friendly)
# Verifies end-to-end training loop, checkpoint saving, held-out evaluation, and visualization

model:
  name: segformer_b2
  encoder_checkpoint: nvidia/mit-b2
  num_classes: 2
  ignore_index: 255
  id2label:
    0: "non_flood"
    1: "flood"
  label2id:
    "non_flood": 0
    "flood": 1

data:
  dataset_name: FloodPlanet
  dataset_root: Datasets
  sensor: PS
  rgb_bands: [2, 1, 0]
  input_size: 256
  num_workers: 0
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  pin_memory: false

label_mapping:
  raw_nodata: 0
  raw_non_flood: 1
  raw_flood: 2
  target_non_flood: 0
  target_flood: 1
  target_ignore: 255

training:
  epochs: 1                       # 1 epoch for fast end-to-end pipeline verification
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.00006
  weight_decay: 0.01
  optimizer: AdamW
  scheduler: cosine
  warmup_ratio: 0.1
  seed: 42
  amp: false
  gradient_clipping: 1.0

evaluation:
  method: LOEO
  inner_val_ratio: 0.17
  checkpoint_metric: val_flood_iou
  threshold: argmax
  report_event_metrics: true
  aggregate_original_pixels: true
  tile_size: 256
  tile_overlap: 0

paths:
  output_dir: outputs
  checkpoints_dir: outputs/checkpoints
  splits_dir: outputs/splits
  logs_dir: outputs/logs
  results_dir: outputs/results
  visualizations_dir: outputs/visualizations
