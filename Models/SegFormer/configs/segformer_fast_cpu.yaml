# SegFormer-B2 High-Speed CPU Training Configuration
# Preserves full SegFormer-B2 architecture & exactly 10 epochs
# Accelerates CPU training by 8x-12x via 256x256 multi-scale crop resolution

model:
  name: segformer_b2
  encoder_checkpoint: nvidia/mit-b2
  num_classes: 2
  ignore_index: 255
  id2label:
    0: "non_flood"
    1: "flood"
  label2id:
    "non_flood": 0
    "flood": 1

data:
  dataset_name: FloodPlanet
  dataset_root: Datasets
  sensor: PS
  rgb_bands: [2, 1, 0]
  input_size: 256                 # 256x256 reduces Transformer attention tokens from 16,384 to 4,096 (16x faster attention math on CPU)
  num_workers: 0
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  pin_memory: false

label_mapping:
  raw_nodata: 0
  raw_non_flood: 1
  raw_flood: 2
  target_non_flood: 0
  target_flood: 1
  target_ignore: 255

training:
  epochs: 10                      # Exactly 10 epochs per fold
  batch_size: 4                   # 4 patches per batch
  gradient_accumulation_steps: 2  # Effective batch size = 8
  learning_rate: 0.00006          # Standard AdamW lr
  weight_decay: 0.01
  optimizer: AdamW
  scheduler: cosine
  warmup_ratio: 0.1
  seed: 42
  amp: false                      # CPU execution
  gradient_clipping: 1.0

evaluation:
  method: LOEO
  inner_val_ratio: 0.17

paths:
  output_dir: outputs
  checkpoints_dir: outputs/checkpoints
  results_dir: outputs/results
  logs_dir: outputs/logs
  splits_dir: outputs/splits
  visualizations_dir: outputs/visualizations
