# SegFormer-B2 LOEO-CV Configuration Optimized for Kaggle GPU (P100 / T4)
# Experiment: Event-Generalizable Flood Inundation Semantic Segmentation

model:
  name: segformer_b2
  encoder_checkpoint: nvidia/mit-b2
  num_classes: 2
  ignore_index: 255
  id2label:
    0: "non_flood"
    1: "flood"
  label2id:
    "non_flood": 0
    "flood": 1

data:
  dataset_name: FloodPlanet
  dataset_root: /kaggle/input/floodplanet/Datasets  # Fallbacks to /kaggle/input/floodplanet or local
  sensor: PS
  rgb_bands: [2, 1, 0]                            # Red, Green, Blue
  input_size: 512
  num_workers: 4                                  # Kaggle 4 vCPUs
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  pin_memory: true

label_mapping:
  raw_nodata: 0
  raw_non_flood: 1
  raw_flood: 2
  target_non_flood: 0
  target_flood: 1
  target_ignore: 255

training:
  epochs: 10                      # Exactly 10 epochs per fold
  batch_size: 4
  gradient_accumulation_steps: 2  # Effective batch size = 8
  learning_rate: 0.00006          # 6e-5
  weight_decay: 0.01
  optimizer: AdamW
  scheduler: cosine
  warmup_ratio: 0.1
  seed: 42
  amp: true                       # Accelerated mixed precision on CUDA
  gradient_clipping: 1.0

evaluation:
  method: LOEO
  inner_val_ratio: 0.17           # 3 events out of 18
  checkpoint_metric: val_flood_iou
  threshold: argmax
  report_event_metrics: true
  aggregate_original_pixels: true
  tile_size: 512
  tile_overlap: 0

paths:
  output_dir: /kaggle/working/outputs
  checkpoints_dir: /kaggle/working/outputs/checkpoints
  splits_dir: /kaggle/working/outputs/splits
  logs_dir: /kaggle/working/outputs/logs
  results_dir: /kaggle/working/outputs/results
  visualizations_dir: /kaggle/working/outputs/visualizations
