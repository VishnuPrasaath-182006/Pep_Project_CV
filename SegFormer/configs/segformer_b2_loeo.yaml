# SegFormer-B2 Leave-One-Event-Out Cross-Validation Configuration
# Experiment: Event-Generalizable Flood Inundation Semantic Segmentation

model:
  name: segformer_b2
  encoder_checkpoint: nvidia/mit-b2
  num_classes: 2
  ignore_index: 255
  id2label:
    0: "non_flood"
    1: "flood"
  label2id:
    "non_flood": 0
    "flood": 1

data:
  dataset_name: FloodPlanet
  dataset_root: Datasets          # Configurable path (supports relative, absolute, or /kaggle/input/...)
  sensor: PS                      # Primary input sensor: PlanetScope
  rgb_bands: [2, 1, 0]            # Verified band indices for RGB: Red (band 3/idx 2), Green (band 2/idx 1), Blue (band 1/idx 0)
  input_size: 512                 # Spatial crop size for training patches and inference tiling
  num_workers: 0                  # 0 for Windows compatibility; configurable to 2 or 4 on Linux/Kaggle
  image_mean: [0.485, 0.456, 0.406]  # ImageNet RGB mean (applied to [0, 1] scaled inputs)
  image_std: [0.229, 0.224, 0.225]   # ImageNet RGB std
  pin_memory: true

label_mapping:
  raw_nodata: 0                   # GDAL_NODATA value
  raw_non_flood: 1                # Background/Land
  raw_flood: 2                    # Flood/Water
  target_non_flood: 0
  target_flood: 1
  target_ignore: 255

training:
  epochs: 10                      # Exactly 10 epochs per fold
  batch_size: 4                   # Configurable batch size
  gradient_accumulation_steps: 2  # Effective batch size = 8
  learning_rate: 0.00006          # 6e-5 as specified
  weight_decay: 0.01
  optimizer: AdamW
  scheduler: cosine
  warmup_ratio: 0.1
  seed: 42
  amp: true                       # Automatic mixed precision when CUDA is available
  gradient_clipping: 1.0

evaluation:
  method: LOEO                    # Leave-One-Event-Out Cross-Validation
  inner_val_ratio: 0.17           # 3 events out of remaining 18 (~17%) for deterministic validation
  checkpoint_metric: val_flood_iou
  threshold: argmax
  report_event_metrics: true
  aggregate_original_pixels: true
  tile_size: 512
  tile_overlap: 0                 # Non-overlapping complete coverage tiling for exact pixel count

paths:
  output_dir: outputs
  checkpoints_dir: outputs/checkpoints
  splits_dir: outputs/splits
  logs_dir: outputs/logs
  results_dir: outputs/results
  visualizations_dir: outputs/visualizations
